services:
  # FastAPI Backend Web Service
  - type: web
    name: gokul-portfolio-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        value: "*"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: jgokul823@gmail.com
      - key: NOTIFICATION_EMAIL
        value: jgokul823@gmail.com
      - key: SMTP_PASSWORD
        sync: false

  # React + Vite Frontend Static Site
  - type: web
    name: gokul-portfolio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: gokul-portfolio-backend
          property: host
