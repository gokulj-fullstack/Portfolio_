    <!-- Initial Theme Script to avoid theme flash -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme') || 'default';
        window.metaColors = {
          'default': '#f7f7f9',
          'dark': '#252526',
          'beach': '#e3f6f5',
          'choco': '#41312E',
          'moomoo': '#f3e1d8',
          'bowser': '#29293e',
          'yoshi': '#f2ede9',
          'rainbow': '#311b46',
          'lobster': '#ffb9ad',
          'hackernews': '#F8F8EC'
        };
        if (theme) {
          document.documentElement.setAttribute('data-theme', theme);
        }
      })();
    </script>
